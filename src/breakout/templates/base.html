<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}BreakOut{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  </head>
  <body>
    <main class="shell">
      <header>
        <div class="header-row">
          <a class="brand" href="/">BreakOut</a>
          <form class="quit-form" method="post" action="/shutdown" onsubmit="return confirm('Quit BreakOut and stop the local server?');">
            <button class="quit-button" type="submit">Quit BreakOut</button>
          </form>
        </div>
        <p>Local, portable library exports</p>
        <p class="running-note">Closing this browser does not stop BreakOut. Use <strong>Quit BreakOut</strong> when you are done.</p>
      </header>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
