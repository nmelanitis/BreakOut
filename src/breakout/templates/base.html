<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}BreakOut{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  </head>
  <body>
    <main class="shell">
      <header>
        <a class="brand" href="/">BreakOut</a>
        <p>Local, portable library exports</p>
      </header>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
