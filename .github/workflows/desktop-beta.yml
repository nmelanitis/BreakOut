name: Desktop Beta Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/desktop-beta-packaging

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            artifact: BreakOut-macOS
          - os: windows-latest
            name: Windows
            artifact: BreakOut-Windows
          - os: ubuntu-latest
            name: Linux
            artifact: BreakOut-Linux
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop build dependencies
        run: uv sync --group desktop --locked
      - name: Build one-file executable
        run: uv run pyinstaller --noconfirm --clean breakout.spec
      - name: Package macOS/Linux executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          zip -j "../${{ matrix.artifact }}.zip" BreakOut
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/BreakOut.exe -DestinationPath "${{ matrix.artifact }}.zip"
      - name: Upload desktop beta
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error
